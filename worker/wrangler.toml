# Cloudflare Worker ("the proxy"). Free plan. No secrets in this file (2.1).
# Secrets are set by the owner with: npx wrangler secret put NAME -c worker/wrangler.toml
name = "meridian-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Comma separated. Localhost is for `npm run dev` only.
ALLOWED_ORIGINS = "https://m14mason.github.io,http://localhost:5173"

# All owner state (devices, pairing codes, encrypted keys, sync, usage) lives in one
# SQLite-backed Durable Object. Free plan: SQLite backend only (verified 2026-10-18).
[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[durable_objects.bindings]]
name = "AIS"
class_name = "AisHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vault"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AisHub"]

[observability]
enabled = true

# Hourly portfolio refresh, Monday to Friday, 13:30 to 21:30 UTC (covers 9:30 to 16:00 New York in EDT and EST).
[triggers]
crons = ["30 13-21 * * 1-5"]
